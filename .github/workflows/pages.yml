name: Build and publish Level Lab libraries
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: level-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: game-forge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: game-forge
      - run: python -m pip install -r game-forge/requirements.txt
      - run: npm test
      - name: Build both libraries (Game Forge originals stay outside Pages)
        env:
          ASSET_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/game-forge/assets/
        run: npm run build:external
      - name: Verify published paths, catalogues and Pages size
        run: npm run check:site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
